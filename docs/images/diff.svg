<text x="18" y="157" fill="#dfe3ea" xml:space="preserve">
<tspan fill="#5dd39e" font-weight="600">FIXED</tspan>
<tspan > (15)</tspan>
</text>
<text x="18" y="176" fill="#dfe3ea" xml:space="preserve">
<tspan >  </tspan>
<tspan fill="#ff6b6b" font-weight="600">CRITICAL</tspan>
<tspan >  Plain HTTP is served without redirecting to HTTPS</tspan>
</text>
<text x="18" y="195" fill="#dfe3ea" xml:space="preserve">
<tspan >  </tspan>
<tspan fill="#ff6b6b" font-weight="600">CRITICAL</tspan>
