# httpsec remediation for Nginx
#
# 20 finding(s) grouped into 17 configuration change(s).
# Review every line before applying it: the snippets are templates,
# and several of them reference hostnames you have to fill in.

# ---------------------------------------------------------------
# Offer only TLS 1.2 and TLS 1.3.
#   - [critical] TLS 1.0 is accepted
#   - [high] TLS 1.1 is accepted
# Note: Check your client population before dropping TLS 1.0/1.1: it mostly affects Android 4.x and Windows XP era clients.
# ---------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;

# ---------------------------------------------------------------
# Redirect every plain-HTTP request to the same host over HTTPS with a single permanent redirect.
#   - [critical] Plain HTTP is served without redirecting to HTTPS
# Note: Redirect to the same host first and let that host redirect to the canonical name, otherwise the browser never records an HSTS entry for the original host.
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# Restrict TLS 1.2 to AEAD suites with forward secrecy and let the server pick the order.
#   - [high] Server accepts cipher suites without forward secrecy
#   - [low] Server accepts CBC-mode cipher suites
# Note: The list above is the Mozilla "intermediate" profile minus the CBC suites.
# ---------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# ---------------------------------------------------------------
# Send Strict-Transport-Security with a one-year max-age and includeSubDomains from the TLS vhost.
#   - [high] No Strict-Transport-Security header
# Note: Only add `preload` once every subdomain is HTTPS-only: submission to hstspreload.org is slow to reverse.
# ---------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ---------------------------------------------------------------
# Deploy an enforced Content-Security-Policy. Start from a nonce-based policy and roll it out with Report-Only first.
#   - [high] No Content-Security-Policy header
# Note: Deploy as Content-Security-Policy-Report-Only first, collect violations for a release cycle, then switch the header name.
# ---------------------------------------------------------------
# Replace $csp_nonce with a per-request nonce (ngx_http_sub_module or your app).
add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$csp_nonce' 'strict-dynamic' https: 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;

# ---------------------------------------------------------------
# Remove 'unsafe-inline' from script-src and adopt per-request nonces with 'strict-dynamic'.
#   - [high] CSP restricts nothing for scripts
#   - [low] CSP restricts nothing for stylesheets
# Note: 'unsafe-inline' is ignored by CSP3 browsers when a nonce is present, so keeping it is safe and helps old clients.
# ---------------------------------------------------------------
# 1. Generate a nonce per request and place it on every <script> tag.
# 2. Then drop 'unsafe-inline' (keep it only as the CSP1 fallback shown here):
add_header Content-Security-Policy "script-src 'nonce-$csp_nonce' 'strict-dynamic' https: 'unsafe-inline'; object-src 'none'; base-uri 'none'" always;

# ---------------------------------------------------------------
# Serve a certificate from a publicly trusted CA that covers the hostname, with the full intermediate chain, and automate renewal.
#   - [medium] Certificate expires in less than 30 days
# Note: Verify the deployed chain with: openssl s_client -connect example.com:443 -servername example.com -showcerts
# ---------------------------------------------------------------
ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # leaf + intermediates
ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
# fullchain.pem, not cert.pem: cert.pem alone leaves the chain incomplete.

# ---------------------------------------------------------------
# Send X-Content-Type-Options: nosniff on every response.
#   - [medium] No X-Content-Type-Options: nosniff
# Note: Make sure Content-Type is correct for every response first, since nosniff makes the declared type binding.
# ---------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# ---------------------------------------------------------------
# Send Referrer-Policy: strict-origin-when-cross-origin or no-referrer.
#   - [medium] No Referrer-Policy header
# Note: strict-origin-when-cross-origin keeps the full URL for same-origin navigation and sends only the origin elsewhere.
# ---------------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---------------------------------------------------------------
# Set base-uri 'none' (or 'self') so an injected <base> tag cannot rewrite relative script URLs.
#   - [medium] CSP does not set base-uri
# Note: base-uri does not fall back to default-src, so it must be listed explicitly.
# ---------------------------------------------------------------
add_header Content-Security-Policy "...; base-uri 'none'" always;

# ---------------------------------------------------------------
# Add a restrictive default-src so unlisted fetch directives inherit a safe fallback.
#   - [medium] CSP has no default-src fallback
# ---------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; ..." always;

# ---------------------------------------------------------------
# Set frame-ancestors to 'none', or to the exact origins allowed to frame the page.
#   - [medium] CSP does not set frame-ancestors
# Note: frame-ancestors supersedes X-Frame-Options and supports multiple origins, which X-Frame-Options never did.
# ---------------------------------------------------------------
add_header Content-Security-Policy "...; frame-ancestors 'none'" always;

# ---------------------------------------------------------------
# Send Cross-Origin-Opener-Policy: same-origin to isolate the browsing context group.
#   - [low] No Cross-Origin-Opener-Policy header
# Note: Use same-origin-allow-popups if the site opens OAuth popups that need window.opener.
# ---------------------------------------------------------------
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ---------------------------------------------------------------
# Send Permissions-Policy denying the features the site does not use.
#   - [low] No Permissions-Policy header
# Note: An empty allowlist `()` denies the feature to the document and to every frame it embeds.
# ---------------------------------------------------------------
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# ---------------------------------------------------------------
# Send X-Frame-Options: DENY for legacy clients, and rely on CSP frame-ancestors for modern ones.
#   - [low] No X-Frame-Options header
# Note: ALLOW-FROM is not supported anywhere; use CSP frame-ancestors when you need to allow specific origins.
# ---------------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# ---------------------------------------------------------------
# Set object-src 'none' to block plugin-based script execution.
#   - [low] CSP does not set object-src 'none'
# ---------------------------------------------------------------
add_header Content-Security-Policy "...; object-src 'none'" always;

# ---------------------------------------------------------------
# Publish /.well-known/security.txt with at least Contact and Expires, served over HTTPS as text/plain.
#   - [low] No /.well-known/security.txt
# Note: Sign the file with PGP and link the signature from the Canonical field if you publish a key.
# ---------------------------------------------------------------
location = /.well-known/security.txt {
    default_type text/plain;
    return 200 "Contact: mailto:security@example.com\nExpires: 2027-01-01T00:00:00.000Z\nPreferred-Languages: en, es\nCanonical: https://example.com/.well-known/security.txt\n";
}
